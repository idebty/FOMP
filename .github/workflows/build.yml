name: Build apps

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/electron/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/electron

      - name: Build app
        run: npx electron-builder --${{ matrix.platform }}
        working-directory: web/electron

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: web/electron/dist/*
          if-no-files-found: error
