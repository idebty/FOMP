<!DOCTYPE html>
<html>

<head>
<title>Fancy Offline Music Player</title>
<link rel="stylesheet" href="../stylesheet/persistant.css">
<link rel="stylesheet" href="../stylesheet/home.css">
<script src="../node_modules/jsmediatags/dist/jsmediatags.min.js"></script>
</head>

<body>

<div class="sidebar">
    <div class="sidebar_search">
        <input type="text" id="sidebar-search" placeholder="Search title, artist, album, year..." autocomplete="off">
    </div>
    <div class="sidebar_main">
    <button class="sidebar_main_btn" id="home" data-nav="home">
        <img src="../images/home.png" alt="Home" class="btn_icon">
        <span>Home</span>
    </button>
    <button class="sidebar_main_btn" id="playlists" data-nav="playlists">
        <img src="../images/playlist.png" alt="playlist" class="btn_icon">
        <span>Playlists</span>
    </button>
    <button class="sidebar_main_btn" id="lyrics-nav-btn" type="button" aria-pressed="false">
        <img src="../images/music.png" alt="" class="btn_icon">
        <span>Lyrics</span>
    </button>

    </div>
    <div class="sidebar_albums">
        <div class="sidebar_section_title">Top songs</div>
        <div class="sidebar_album_list" id="top-songs-list"></div>
        <div class="sidebar_section_title">Top playlists</div>
        <div class="sidebar_album_list" id="top-playlists-list"></div>
    </div>
    <div class="sidebar_footer">
    <button class="sidebar_btn" id="settings" data-nav="settings">
        <img src="../images/settings.png" alt="settings" class="btn_icon">
        <span>Settings</span>
    </button>

    </div>
</div>

<div class="body_main">
    <div class="header">
        <img id="header-cover" src="../images/music.png" alt="Cover">
        <div class="header-info">
            <span id="header-label">Local Library</span>
            <h1 id="header-title">Your Music</h1>
            <label for="file-upload" class="upload-btn">Upload Music</label>
            <input type="file" id="file-upload" multiple accept=".mp3,.wav">
        </div>
    </div>

    <div class="tracklist-container">
        <div class="tracklist-header">
            <div>#</div>
            <div>Title</div>
            <div>Album</div>
            <div></div>
        </div>
        <div class="tracklist" id="tracklist">
        </div>
    </div>

    <section class="lyrics-view" id="lyrics-view" aria-live="polite" aria-label="Lyrics">
        <button id="fullscreen-exit-btn" class="fullscreen-exit-btn" type="button" title="Exit fullscreen player">Exit fullscreen</button>
        <div class="lyrics-heading">
            <img id="lyrics-cover" src="../images/music.png" alt="Album cover">
            <div class="lyrics-track-info">
                <span>Lyrics</span>
                <h2 id="lyrics-title">Nothing playing</h2>
                <p id="lyrics-artist"></p>
                <span id="lyrics-status" class="lyrics-status">Play a song to find its lyrics.</span>
                <div class="lyrics-search-wrap">
                    <form class="lyrics-search" id="lyrics-search-form">
                        <input type="search" id="lyrics-search-title" placeholder="Search by song title" aria-label="Search lyrics by song title" aria-controls="lyrics-search-suggestions" aria-expanded="false" aria-haspopup="listbox" autocomplete="off">
                        <button type="submit" class="upload-btn lyrics-import-btn">Search Lyrics</button>
                    </form>
                    <div class="lyrics-search-suggestions" id="lyrics-search-suggestions" role="listbox" aria-label="Song suggestions" hidden></div>
                </div>
                <div class="lyrics-actions">
                    <label class="upload-btn lyrics-import-btn" id="lyrics-import-btn" for="lyrics-import-input">Import Lyrics</label>
                </div>
                <input type="file" id="lyrics-import-input" accept=".lrc,.txt,text/plain" style="display:none;">
            </div>
        </div>
        <div class="lyrics-lines" id="lyrics-lines"></div>
    </section>

    <div class="player-bar">
        <div class="mini-track-info" aria-live="polite">
            <img class="mini-track-cover" id="mini-track-cover" src="../images/music.png" alt="">
            <div class="mini-track-copy"><strong id="mini-track-title">Nothing playing</strong><span id="mini-track-artist"></span></div>
        </div>
        <button id="mini-player-toggle" class="mini-player-toggle" type="button" title="Return to full player" aria-label="Return to full player">↗</button>
        <div class="player-progress">
            <span class="time-label" id="time-current">0:00</span>
            <input type="range" id="seek-slider" class="seek-slider" min="0" max="0" step="0.1" value="0">
            <span class="time-label" id="time-duration">0:00</span>
        </div>
        <div class="player-main-row">
            <div class="player-controls">

                <button id="shuffle-btn" class="control-text-btn">Shuffle</button>
                <button id="prev-btn" class="control-btn"><img src="../images/left.png" alt="Back"></button>
                <button id="play-btn" class="control-btn play-btn-circle"><img id="play-icon" src="../images/play.png" alt="Play"></button>
                <button id="next-btn" class="control-btn"><img src="../images/right.png" alt="Next"></button>
                <button id="repeat-all-btn" class="control-text-btn">Repeat All</button>
                <button id="repeat-one-btn" class="control-text-btn">Repeat 1</button>
            </div>
                <div class="player-volume">
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
                <div class="player-eq">
    <button id="eq-toggle-btn" class="control-text-btn" title="Equalizer">EQ</button>
    <div class="eq-panel" id="eq-panel" style="display:none;">
        <label>Bass<input type="range" id="eq-bass" min="-15" max="15" step="1" value="0"></label>
        <label>Mid<input type="range" id="eq-mid" min="-15" max="15" step="1" value="0"></label>
        <label>Treble<input type="range" id="eq-treble" min="-15" max="15" step="1" value="0"></label>
        <label class="eq-normalize-toggle">
            <input type="checkbox" id="normalize-toggle">
            Normalize Volume
        </label>
    </div>
</div>
        </div>
        <audio id="main-player"></audio>
    </div>
</div>

</body>
<script src="../javascript/persistant.js" defer></script>
<script src="../javascript/lyrics.js" defer></script>
<script src="../javascript/home.js" defer></script>

</html>
